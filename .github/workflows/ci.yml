name: CI

# GAME_BRIEF.md §6 step 1: the shim, CI on push, and a gate skeleton that fails
# loudly when there is no engine to hash.
#
# THE GATE JOB IS EXPECTED TO BE RED UNTIL STEP 2. There is no engine yet, so
# there is nothing to fingerprint, and a gate that reported green against an
# empty engine would teach everyone to read green as meaning nothing. The
# compile and selftest jobs are green now and stay green.

# Push only. A `pull_request` trigger alongside this one runs the whole job a
# second time on the same commit for any branch with a PR open, which is two
# identical reds for one push. Branches in this repository get their checks from
# the push event, and those show on the PR.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# A newer push supersedes an older run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_VERSION: 2.0.21
  # The container locale is not guaranteed to be UTF-8 and the gate's output
  # contains section marks and dashes. Without this the breakdown arrives in
  # the log as question marks, which is a readable-breakdown requirement failed
  # on a technicality.
  JAVA_OPTS_ENCODING: -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Kotlin compiler
        id: kotlinc-cache
        uses: actions/cache@v4
        with:
          path: ~/kotlinc
          key: kotlinc-${{ env.KOTLIN_VERSION }}

      - name: Fetch the Kotlin compiler
        if: steps.kotlinc-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL --retry 3 -o kotlin.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q kotlin.zip -d "$HOME"

      # Everything compiles headless against the Java2D shim. This is the claim
      # in §1.1 and it is checked on every push, from the first push, so it can
      # never quietly stop being true.
      - name: Compile the engine, the renderer and the gate
        run: |
          export PATH="$PATH:$HOME/kotlinc/bin"
          SRC=app/src/main/java/com/dugout/career
          kotlinc -nowarn \
            $SRC/sim/*.kt $SRC/ui/*.kt \
            tools/shim/*.kt \
            tools/gate/*.kt \
            tools/harness/*.kt \
            -include-runtime -d build/gate.jar

      # The one part of the gate that can be proved before an engine exists:
      # that the shape breakdown names the statistic that moved, by how much,
      # worst first, and ignores a change smaller than its quantum.
      - name: Gate selftest — the readable breakdown
        run: java $JAVA_OPTS_ENCODING -Djava.awt.headless=true -cp build/gate.jar gate.GateKt --selftest

      # The supervisor's core property: adding randomness must not disturb
      # what is already there. If this ever fails, the fingerprint stops
      # meaning what it claims to mean.
      - name: DrawCheck — adding a draw disturbs nothing
        run: java $JAVA_OPTS_ENCODING -Djava.awt.headless=true -cp build/gate.jar harness.DrawCheckKt

      # Does a tactical setting move the football? A dead lever prints its own
      # verdict here rather than being discovered months later in a sweep.
      - name: ShapeCheck — line height and block width
        run: |
          java $JAVA_OPTS_ENCODING -Djava.awt.headless=true \
            -cp build/gate.jar harness.ShapeCheckKt 8 | tee shapecheck.txt
          grep -q "VERDICT: line height moves the block" shapecheck.txt \
            || { echo "::error::ShapeCheck says the line-height lever is dead."; exit 1; }

      # Roles must not be decoration. Same slot, same anchor, same seeds, one
      # role changed — if any pair of roles ever collapses into the same heat
      # map again, this fails the build.
      - name: RoleCheck — every role separates
        run: |
          java $JAVA_OPTS_ENCODING -Djava.awt.headless=true \
            -cp build/gate.jar harness.RoleCheckKt 4 | tee rolecheck.txt
          grep -q "VERDICT: every pair separates" rolecheck.txt \
            || { echo "::error::A role pair collapsed — RoleCheck says some role is decoration."; exit 1; }

      # The option set the off-ball layer offers. Printed, NOT gated: it does
      # not clear the §5 bar yet, and whether the bar or the football is wrong
      # is the owner's call, not something to be quietly tuned around.
      - name: OptionCensus — the §5 option-set bar
        run: java $JAVA_OPTS_ENCODING -Djava.awt.headless=true -cp build/gate.jar harness.OptionCensusKt 20

      # The census. Printed for the record, not gated: with no decision layer
      # every acceptance row is either unwired or noise, and gating on noise is
      # how a project starts tuning against a number that means nothing. It
      # becomes a gate when the decision layer lands.
      - name: EventCensus — the vocabulary and the §5 bands
        run: java $JAVA_OPTS_ENCODING -Djava.awt.headless=true -cp build/gate.jar harness.EventCensusKt 40

      # Render frames and look at them. Uploaded so they can be looked at from
      # a phone, which is the whole point of the debug renderer existing at
      # step 2 rather than step 10.
      - name: Debug frames
        run: |
          java $JAVA_OPTS_ENCODING -Djava.awt.headless=true -cp build/gate.jar harness.FilmKt build/film 1000
          java $JAVA_OPTS_ENCODING -Djava.awt.headless=true -cp build/gate.jar harness.RoleFilmKt build/film

      - uses: actions/upload-artifact@v4
        with:
          name: debug-frames
          path: build/film/*.png
          if-no-files-found: error

      # The gate itself. Red until the owner records a baseline. The exit codes
      # are translated here so the log says which kind of red it is.
      - name: Fingerprint gate
        run: |
          set +e
          java $JAVA_OPTS_ENCODING -Djava.awt.headless=true -cp build/gate.jar gate.GateKt
          code=$?
          set -e
          echo
          case $code in
            0) echo "Gate green: both fingerprints unchanged." ;;
            1) echo "::error::A fingerprint moved. The breakdown above is the argument; the owner re-records, not the agent." ;;
            2) echo "::error::EXPECTED UNTIL STEP 2 — no engine to fingerprint. This job is red on purpose (GAME_BRIEF.md §6). It goes green when step 2 wires an engine in and the owner records the first baseline." ;;
            3) echo "::error::EXPECTED UNTIL THE BASELINE IS RECORDED — the engine ran and both fingerprints were computed, but there is nothing to compare them against. build/baseline.proposed.properties has the lines; the owner records them, not the agent (§1.2)." ;;
            4) echo "::error::The gate refused --record. Re-recording is the owner's call." ;;
            *) echo "::error::Gate exited $code, which it is not supposed to be able to do." ;;
          esac
          exit $code
